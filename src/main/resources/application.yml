server:
  port: 8080

spring:
  application:
    name: 'ms-curriculum'
  data:
    mongodb:
      uri: ${MONGO_URI} # 'mongodb://admin:admin123@localhost:27017'
      database: ${MONGO_DB} # resume_db

jwt-configuration:
  secret-key: 'dd5acda9c2e4dca80ab89d0af0968fe11dc69938b0ad3968057f59aa315a655743afeb3f7db41c582c31af45ed46a32f9504'
  expiration-time: 86400

cors-configuration:
  allowed-origins: ${ALLOWED_ORIGINS} #'http://localhost:4200, http://localhost:80'
  allowed-methods: 'GET, POST, PUT, DELETE, OPTIONS, PATCH'
  allowed-headers: '*'

springdoc:
  api-docs:
    enabled: true
  default-consumes-media-type: 'application/json'
  default-produces-media-type: 'application/json'

api-swagger:
  url-dev: 'http://localhost:${server.port}'
  description-dev: 'Development server'
  url-prod: 'https://api.alkz.com'
  description-prod: 'Production server'
  contact-name: 'Support Alkz Team'
  contact-email: 'support@alkz.com'
  contact-url: 'https://alkz.com'
  license-name: 'MIT License'
  license-url: 'https://opensource.org/licenses/MIT'
  info-title: 'API Documentation for ms-curriculum'
  info-version: '1.0.0'
  info-description: 'This is the API documentation for the curriculum microservice.'
  info-terms-of-service: 'https://alejdaf.com/terms'
  security-scheme-name: 'Authorization'
  security-scheme-description: 'Use the JWT token obtained after login to authorize requests. Format: {token}'
  security-scheme-scheme: 'bearer'
  security-scheme-bearer-format: 'JWT'
